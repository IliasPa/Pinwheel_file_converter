name: Tests

# Runs the whole test suite (make test) on every push and pull request.
on:
  push:
    branches: ["**"]  # not for version tags: their commit was already tested
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The newest Xcode on the runner, to be closest to the Swift that
      # builds the app (older ones can't type-check some expressions in time).
      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          sw_vers
          xcode-select -p
          swift --version

      # The tests also cover what these tools do (MP3, GIFs, small PNGs, Greek text, WebP).
      - name: Install ffmpeg, pngquant, Tesseract and WebP
        run: brew install ffmpeg pngquant tesseract webp

      - name: Add Tesseract's Greek, where Pinwheel's Settings puts it
        run: |
          folder="$HOME/Library/Application Support/Pinwheel/tessdata"
          mkdir -p "$folder"
          curl -fsSL -o "$folder/ell.traineddata" https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/ell.traineddata

      # One test at a time: on GitHub's 3-core Macs (no hardware video
      # encoder), ImageIO's HEIC/AVIF encoder and Vision block their thread
      # while needing Swift's shared threads, so three of them side by side
      # stall everything. (In the app each job runs alone in its own worker.)
      # A run that stops moving still shows every thread's stack and fails
      # after 20 minutes, instead of waiting out the hour.
      - name: Run the tests
        run: |
          scripts/test.sh --no-parallel &
          tests=$!
          for _ in $(seq 1 120); do
            if ! kill -0 "$tests" 2>/dev/null; then
              wait "$tests"
              exit $?
            fi
            sleep 10
          done
          echo "::error::The tests stopped moving; here's where every thread was."
          for pid in $(pgrep -f "swiftpm-testing-helper|xctest"); do
            sample "$pid" 2 -file "/tmp/stuck-$pid.txt" > /dev/null 2>&1 && cat "/tmp/stuck-$pid.txt"
          done
          kill "$tests"
          exit 1
